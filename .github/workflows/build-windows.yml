name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        run: npx tauri build
        env:
          # Clé privée de signature des mises à jour, stockée dans les secrets du dépôt.
          # Sans elle, le build produit un installateur non signé que l'updater refusera.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: revision-tp-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: revision-tp-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      # L'updater Tauri interroge latest.json : il doit décrire la version publiée,
      # porter la signature de l'installateur et pointer vers son URL de téléchargement.
      - name: Build latest.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          export VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="${GITHUB_REF#refs/tags/}"

          SETUP=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          SIG_FILE="${SETUP}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "Signature absente : le secret TAURI_SIGNING_PRIVATE_KEY est-il bien configuré ?" >&2
            exit 1
          fi
          export SIGNATURE=$(cat "$SIG_FILE")

          ASSET=$(basename "$SETUP")
          # Le nom du fichier contient un espace : il doit être encodé dans l'URL.
          ASSET_URL_PART=${ASSET// /%20}
          export URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET_URL_PART}"

          node -e "
            const fs = require('fs');
            fs.writeFileSync('latest.json', JSON.stringify({
              version: process.env.VERSION,
              notes: 'Voir les notes de version sur GitHub.',
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: process.env.SIGNATURE,
                  url: process.env.URL,
                },
              },
            }, null, 2));
          "
          cat latest.json

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            latest.json
