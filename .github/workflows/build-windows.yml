name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app
        run: npx tauri build
        env:
          # Clé privée de signature des mises à jour, stockée dans les secrets du dépôt.
          # Sans elle, le build produit un installateur non signé que l'updater refusera.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: revision-tp-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: revision-tp-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi

      # latest.json est produit APRES la publication des binaires, et l'URL de
      # telechargement est lue aupres de GitHub plutot que reconstruite : GitHub
      # renomme les assets (les espaces deviennent des points), donc toute URL
      # devinee finit en 404 et la mise a jour echoue au telechargement.
      - name: Publish latest.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          export VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          SETUP=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          if [ ! -f "${SETUP}.sig" ]; then
            echo "Signature absente : le secret TAURI_SIGNING_PRIVATE_KEY est-il configure ?" >&2
            exit 1
          fi
          export SIGNATURE=$(cat "${SETUP}.sig")

          export URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name | endswith("-setup.exe")) | .browser_download_url')
          if [ -z "$URL" ]; then
            echo "Installateur introuvable dans la release ${TAG}." >&2
            exit 1
          fi
          echo "URL de l'installateur : $URL"

          node -e "
            const fs = require('fs');
            fs.writeFileSync('latest.json', JSON.stringify({
              version: process.env.VERSION,
              notes: 'Voir les notes de version sur GitHub.',
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: process.env.SIGNATURE,
                  url: process.env.URL,
                },
              },
            }, null, 2));
          "
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

          # Garde-fou : l'URL publiee doit repondre, sinon la mise a jour echouerait chez l'apprenant.
          CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")
          echo "Verification de l'URL : HTTP $CODE"
          [ "$CODE" = "200" ]
